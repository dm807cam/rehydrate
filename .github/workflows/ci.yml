name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new push lands; the
# older run's result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

# Runner strategy (cost-aware, GitHub-hosted):
#   * Everything that is platform-independent runs on `ubuntu-latest`
#     (1x billing): the Node UI checks, `cargo fmt`, and clippy/test for
#     every crate except the Tauri shell. `keyring`'s real macOS backend
#     is `cfg(target_vendor = "apple")`-gated, so on Linux it compiles to
#     the in-memory mock and the library crates build cleanly.
#   * Only `rehydrate-app` (Tauri + Apple Keychain) needs macOS, so it
#     gets a single `macos-latest` (Apple Silicon, 10x billing) job that
#     does just the app build. Keeping the expensive runner scoped to the
#     one crate that requires it is the whole point of the split.
#   * The supply-chain audit is pure dependency-metadata analysis and
#     runs on Linux.
jobs:
  checks:
    name: UI + Rust libraries (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Vite 8 requires Node ^20.19 || >=22.12. Pinning "22" picks
          # the latest Node 22 LTS so we're never closer to the bound
          # than necessary.
          node-version: "22"

      # `npm ci` enforces lockfile parity; a drift between
      # `package.json` and `package-lock.json` should fail loudly rather
      # than be silently papered over.
      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: UI typecheck
        working-directory: ui
        run: npm run typecheck

      - name: UI lint
        working-directory: ui
        run: npm run lint

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # `rehydrate-app` is the Tauri shell — it needs macOS system
      # frameworks and the embedded UI bundle, so it is built on the
      # macOS job instead. Everything else is portable Rust.
      - name: cargo clippy (workspace minus app)
        run: cargo clippy --workspace --exclude rehydrate-app --all-targets -- -D warnings

      - name: cargo test (workspace minus app)
        run: cargo test --workspace --exclude rehydrate-app --no-fail-fast

  app-build:
    name: Tauri app (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # Guard against the `keyring` mock-store regression (#58): if the
      # `apple-native` feature is dropped from `Cargo.toml`, the crate
      # silently compiles to an in-memory backend and "Remember
      # password" stops persisting across restarts — without any
      # warning at runtime. The presence of `security-framework` in the
      # resolved lockfile is the cheapest deterministic signal that the
      # real Keychain backend is linked.
      - name: Guard keyring backend (Cargo.lock has security-framework)
        run: |
          grep -q '^name = "security-framework"' Cargo.lock \
            || (echo "::error::keyring backend missing — Cargo.lock has no security-framework entry. Did the apple-native feature get dropped?"; exit 1)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # The Tauri build embeds the compiled UI (`frontendDist`), so the
      # bundle has to exist before `cargo build` resolves the app crate.
      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: cargo clippy (app)
        run: cargo clippy -p rehydrate-app --all-targets -- -D warnings

      - name: cargo test (app)
        run: cargo test -p rehydrate-app --no-fail-fast

      - name: cargo build (app)
        run: cargo build -p rehydrate-app

  audit:
    name: Supply chain audit (Linux)
    runs-on: ubuntu-latest
    # Hard-gate (issue #19). `cargo deny check` and `cargo audit`
    # both read from `.cargo/audit.toml` + `deny.toml`, which carry
    # the triage rationale (with required `reason` fields) for each
    # ignored advisory. A red audit run means a genuinely new
    # advisory has landed on a transitive dep: the resolution is
    # either bump-the-dep or add a new `ignore` entry with a
    # one-line rationale and ship.
    #
    # v1.0 has no auto-update, so every installed copy carries the
    # exposure window of any CVE that lands between commits — the
    # triage cost of failing fast is much cheaper than the
    # alternative of letting an advisory go unnoticed in the logs.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      # `cargo audit` reads ignores from `.cargo/audit.toml`. With
      # `--deny warnings` a green run means "no unmaintained or
      # vulnerable crate that we haven't already triaged."
      - name: cargo audit
        run: cargo audit --deny warnings

      # `cargo deny check` covers advisories + license drift + the
      # banned-crate list (openssl, native-tls). Configured in
      # `deny.toml`; ignores carry a `reason` field that's required
      # by cargo-deny for each entry.
      - name: cargo deny
        run: cargo deny check
