name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new push lands; the
# older run's result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

# Self-hosted macOS ARM runner (M1). Intel macs and Linux/Windows are
# intentionally unsupported.
jobs:
  rust:
    name: Rust + UI (macOS, Apple Silicon)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Vite 8 requires Node ^20.19 || >=22.12. Pinning "22" picks
          # the latest Node 22 LTS so we're never closer to the bound
          # than necessary.
          node-version: "22"

      # `npm ci` enforces lockfile parity; a drift between
      # `package.json` and `package-lock.json` should fail loudly rather
      # than be silently papered over.
      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: UI typecheck
        working-directory: ui
        run: npm run typecheck

      - name: UI lint
        working-directory: ui
        run: npm run lint

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: cargo build
        run: cargo build --workspace

  audit:
    name: Supply chain audit
    runs-on: [self-hosted, macOS, ARM64]
    # Soft-gate: a new advisory landing between commits shouldn't
    # block a merge that's otherwise green. `cargo deny check` and
    # `cargo audit` both read from `.cargo/audit.toml` + `deny.toml`,
    # which carry the triage rationale for each ignored advisory.
    # The audit job stays green for known-and-justified advisories
    # and goes yellow when a genuinely new one lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      # `cargo audit` reads ignores from `.cargo/audit.toml`. With
      # `--deny warnings` a green run means "no unmaintained or
      # vulnerable crate that we haven't already triaged."
      - name: cargo audit
        run: cargo audit --deny warnings

      # `cargo deny check` covers advisories + license drift + the
      # banned-crate list (openssl, native-tls). Configured in
      # `deny.toml`; ignores carry a `reason` field that's required
      # by cargo-deny for each entry.
      - name: cargo deny
        run: cargo deny check
