[package]
name = "rehydrate-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "reHydrate desktop app: Tauri binary."

[lib]
name = "rehydrate_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rehydrate-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rehydrate-core = { path = "../rehydrate-core" }
rehydrate-device = { path = "../rehydrate-device", features = ["ssh"] }
rehydrate-sync = { path = "../rehydrate-sync" }
rehydrate-ocr = { path = "../rehydrate-ocr" }
rehydrate-publish = { path = "../rehydrate-publish" }
# Notebook (.rm → PDF) renderer. Pure render logic with no Tauri
# surface; lives in its own crate so it can be unit-tested without a
# Tauri shell.
rehydrate-render = { path = "../rehydrate-render" }
# Pulled in to convert OCR transcript Markdown into HTML for
# Ghost/WordPress drafts in `ocr_commands::publish_transcript`.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

directories = { workspace = true }
keyring = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Native OS drag-source so notebook tiles can be dragged out of the
# webview into Finder / the Desktop and have the OS receive a real
# file path. Pure passthrough on the Rust side — the JS counterpart
# (`@crabnebula/tauri-plugin-drag`) calls `startDrag` from the
# `onDragStart` handler with a path produced by `prepare_export_pdf`.
tauri-plugin-drag = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = "0.22"
tempfile = { workspace = true }

[features]
# `devtools` enables the Tauri webview inspector (F12 / Cmd+Opt+I).
# Default-OFF so any ad-hoc build (`cargo build`, a fork's CI, a
# future workflow refactor that drops the explicit
# `--no-default-features` flag) ships *without* the inspector.
# Daily development uses `cargo tauri dev --features devtools` —
# the friction is intentional, since an open inspector lets the
# renderer call any registered Tauri command and skip every other
# IPC boundary in the app.
default = []
devtools = ["tauri/devtools"]
