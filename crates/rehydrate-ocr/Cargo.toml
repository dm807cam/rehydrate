[package]
name = "rehydrate-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "reHydrate OCR layer: vision-LLM transcript pipeline (model store + page render + backend trait)."

[features]
# `mistral` enables the embedded vision-LLM runtime via mistral.rs.
# Off-by-default for the crate itself so unit-test builds and dev
# iteration on the rest of the workspace don't pay the candle +
# Metal compile cost. `rehydrate-app`'s default features turn it on
# for the user-facing binary.
default = []
mistral = ["dep:mistralrs", "dep:anyhow", "dep:hf-hub"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true }
# `hf-hub` is already pulled into the dep graph by `mistralrs`. Wiring it
# in here directly (same major) lets us drive our own per-file
# `download_with_progress` so the UI shows real byte progress instead of
# the silent download mistral.rs's hf-hub integration emits to stderr.
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["ureq"] }
hex = { workspace = true }
image = { workspace = true }
imageproc = "0.25"
mistralrs = { version = "0.8", optional = true }
rm-parser = { path = "../rm-parser" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"

[dev-dependencies]
tempfile = { workspace = true }
