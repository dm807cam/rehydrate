[package]
name = "rehydrate-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "reHydrate OCR layer: per-page rendering + Ollama-backed vision-LLM transcription."

[dependencies]
async-trait = { workspace = true }
base64 = "0.22"
hex = { workspace = true }
image = { workspace = true }
imageproc = "0.26"
rm-parser = { path = "../rm-parser" }
# Host-pinned, redirect-refusing ureq agent + URL safety check.
# Lives in its own crate so the privacy invariants are enforced in
# one place; the `no_egress.rs` integration test treats this crate
# as the single sanctioned egress path.
rehydrate-http = { path = "../rehydrate-http" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
