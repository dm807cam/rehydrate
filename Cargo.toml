[workspace]
resolver = "2"
members = [
    "crates/rm-parser",
    "crates/rehydrate-core",
    "crates/rehydrate-device",
    "crates/rehydrate-sync",
    "crates/rehydrate-app",
    "crates/rehydrate-http",
    "crates/rehydrate-ocr",
    "crates/rehydrate-publish",
    "crates/rehydrate-render",
    "tests-integration",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dm807cam/rehydrate"
rust-version = "1.82"
# Workspace crates are application code; none are intended for
# crates.io publication. Marking them `publish = false` also lets
# `cargo deny`'s `allow-wildcard-paths` apply to internal
# path-dep wildcards.
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
directories = "6"
futures = "0.3"
hex = "0.4"
keyring = "3"
russh = "0.60"
russh-sftp = "2"
secrecy = { version = "0.10", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
printpdf = { version = "0.9", features = ["png"] }
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Unwinding is not load-bearing in the app (every fallible path uses
# `Result` / `thiserror`, every Tauri command maps panics to error
# strings). Aborting on panic shaves a few percent off the binary and
# eliminates the unwinder from the runtime.
panic = "abort"
